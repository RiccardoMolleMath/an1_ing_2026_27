<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orologio Mondiale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .title {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .clock:hover {
            transform: translateY(-10px);
        }

        .city-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .timezone-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }

        .time {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .date {
            font-size: 0.95em;
            color: #999;
            font-family: 'Courier New', monospace;
        }

        .controls {
            text-align: center;
            margin-top: 30px;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
        }

        button:hover {
            background: #667eea;
            color: white;
        }

        .info {
            color: white;
            text-align: center;
            margin-top: 20px;
            font-size: 0.95em;
        }

        @media (max-width: 768px) {
            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 1.8em;
            }

            .time {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Orologio Mondiale</h1>
        
        <div class="clocks-grid" id="clocksGrid"></div>

        <div class="controls">
            <button onclick="toggleFormat()">Cambia Formato (12/24h)</button>
            <button onclick="resetClocks()">Ripristina</button>
        </div>

        <div class="info">
            Orologi in diversi fusi orari aggiornati in tempo reale
        </div>
    </div>

    <script>
        let is24Hour = true;
        
        const timezones = [
            { city: "Italia", tz: "Europe/Rome" },
            { city: "Londra", tz: "Europe/London" },
            { city: "New York", tz: "America/New_York" },
            { city: "Tokyo", tz: "Asia/Tokyo" },
            { city: "Sydney", tz: "Australia/Sydney" },
            { city: "Dubai", tz: "Asia/Dubai" }
        ];

        function updateClocks() {
            const grid = document.getElementById("clocksGrid");
            grid.innerHTML = "";

            timezones.forEach(function(item) {
                const now = new Date();
                
                const timeStr = now.toLocaleString("it-IT", {
                    timeZone: item.tz,
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: !is24Hour
                });

                const dateStr = now.toLocaleString("it-IT", {
                    timeZone: item.tz,
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });

                const clockDiv = document.createElement("div");
                clockDiv.className = "clock";
                clockDiv.innerHTML = 
                    "<div class='city-name'>" + item.city + "</div>" +
                    "<div class='timezone-info'>" + item.tz + "</div>" +
                    "<div class='time'>" + timeStr + "</div>" +
                    "<div class='date'>" + dateStr + "</div>";
                
                grid.appendChild(clockDiv);
            });
        }

        function toggleFormat() {
            is24Hour = !is24Hour;
            updateClocks();
        }

        function resetClocks() {
            is24Hour = true;
            updateClocks();
        }

        setInterval(updateClocks, 1000);
        updateClocks();
    </script>
</body>
</html>
